name: Build Windows runnable JAR

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test executable JAR
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Confirm JavaFX Windows runtime is bundled
        shell: pwsh
        run: |
          $entries = & jar tf target/AnyConverter.jar
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read built JAR' }
          if ($entries -notcontains 'com/sun/glass/ui/win/WinApplication.class') {
            throw 'Windows JavaFX graphics classes are missing from JAR'
          }
          if ($entries -notcontains 'glass.dll') {
            throw 'Windows JavaFX native libraries are missing from JAR'
          }

      - name: Upload runnable JAR as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyConverter-Windows-JAR
          path: target/AnyConverter.jar
          if-no-files-found: error

      # Publish the exact tested JAR as a downloadable repository file.
      - name: Publish runnable JAR in dist
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "AnyConverter-Build"
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/contents/dist/AnyConverter.jar"
          $payload = @{
            message = "Publish built Windows JAR [skip ci]"
            branch = "main"
            content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD "target/AnyConverter.jar")))
          }

          try {
            $existing = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $payload.sha = $existing.sha
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }

          $json = ConvertTo-Json -InputObject $payload -Compress
          Invoke-RestMethod -Uri $url -Headers $headers -Method Put -ContentType "application/json" -Body $json
